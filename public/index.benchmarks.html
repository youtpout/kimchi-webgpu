<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>WebGPU Tests</title></head>
<body>
<h1>WebGPU Tests</h1>
<div id="test-results"></div>
<script type="module">
  import './bundle.benchmarks.js';
  window.addEventListener('DOMContentLoaded', () => {
    if (!window.runTests) {
      console.error('runTests not found on globalThis!');
      return;
    }
    window.runTests();
  });
</script>
</body>
</html>
